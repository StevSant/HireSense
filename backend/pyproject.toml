[project]
name = "hiresense"
version = "0.1.0"
description = "AI-powered job matching and CV optimization system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.51.0",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.30.0",
    "pgvector>=0.5.0",
    "alembic>=1.18.5",
    "httpx>=0.27.0",
    "apscheduler>=3.11.3",
    "python-multipart>=0.0.32",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "langgraph>=1.2.10",
    "langchain-core>=1.5.2",
    "langchain-anthropic>=1.5.3",
    "sentence-transformers>=5.6.1",
    "feedparser>=6.0.13",
    "beautifulsoup4>=4.15.0",
    "pyyaml>=6.0",
    "playwright>=1.59.0",
    "psycopg2-binary>=2.9.12",
    "pymupdf>=1.28.0",
    "cryptography>=49.0.0",
    "python-dotenv>=1.0.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.63b1",
    "opentelemetry-instrumentation-httpx>=0.63b1",
]

[project.optional-dependencies]
groq = ["langchain-groq>=1.1.3"]
ollama = ["langchain-ollama>=1.1.0"]

[project.scripts]
app = "hiresense._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiresense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "pgvector: requires a live Postgres+pgvector DB (docker compose up db); skipped unless explicitly selected",
]

[tool.ruff]
target-version = "py312"
line-length = 100

# Pin the rule selection explicitly instead of relying on ruff's implicit
# defaults. Ruff 0.16.0 widened its default set (UP/I/B/SIM/DTZ/RUF/…), which
# surfaced ~800 findings the project never opted into. Keeping the previous
# default set here makes lint behaviour independent of the ruff version;
# adopting further rule families is a deliberate, separate change.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Type checking. The ports-and-adapters contract this codebase documents was,
# until now, unenforced: constructor dependencies annotated `Any` meant a domain
# service could call a method that exists only on the concrete infrastructure
# class and nothing would object. That is not hypothetical — AutoHuntService
# called `jobs_repo.list_since()`, which lived on JobsRepository but on neither
# JobsRepositoryPort nor InMemoryJobsRepository, so substituting the in-memory
# double raised AttributeError. `Any` did not merely hide that violation, it
# enabled it.
#
# `basic` is deliberate: `strict` additionally demands full annotation coverage,
# which would bury the real findings under thousands of missing-annotation
# reports. Raise it only once `ignore` below is empty.
#
# pythonVersion tracks requires-python (the floor), not the version CI installs,
# so syntax newer than the declared floor is caught here rather than by a user.
[tool.pyright]
include = ["src/hiresense"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "All"

# Debt ledger, not configuration. Every path here fails `basic` today; the list
# only ever shrinks. Checking is ON everywhere else, so a NEW file is type-checked
# from its first commit and cannot join this list — that is the point of listing
# failures explicitly instead of narrowing `include` to the clean modules.
#
# Removing an entry is the unit of work: fix the file, delete its line, commit.
ignore = [
    # Optional LLM extras (groq / ollama) are not installed in the default sync,
    # so their imports are unresolved by construction.
    "src/hiresense/admin/infrastructure/llm_factory.py",
    # Third-party typing friction: OTel exporter variance, bs4's AttributeValueList,
    # starlette's exception-handler signature, langchain's astream element type.
    "src/hiresense/shared/adapters/llm/langchain_adapter.py",
    "src/hiresense/shared/observability/exporters.py",
    "src/hiresense/shared/kernel/exception_handlers.py",
    "src/hiresense/composition/preference.py",
    "src/hiresense/ingestion/adapters/generic_scraper_adapter.py",
    # `object`-typed provider lookups in api/dependencies.py — every attribute
    # access on a provider is an error until the accessors are generic.
    "src/hiresense/optimization/api/routes.py",
    "src/hiresense/profile/api/routes.py",
    "src/hiresense/applications/api/routes.py",
    # Domain models declaring `id: UUID | None` consumed where `UUID` is required.
    "src/hiresense/applications/domain/application_service.py",
    "src/hiresense/applications/domain/apply_service.py",
    "src/hiresense/applications/domain/artifact_service.py",
    "src/hiresense/applications/domain/ats_field_map.py",
    "src/hiresense/profile/domain/services.py",
    # Optional collaborators (`X | None`) dereferenced without narrowing. These
    # encode intended APP_MODE=local degradation; fixing them is a behavioural
    # decision, not a typing one.
    "src/hiresense/ingestion/domain/embedding_backfill_service.py",
    "src/hiresense/ingestion/domain/job_quality_classifier.py",
    "src/hiresense/ingestion/domain/portal_scanner.py",
    "src/hiresense/ingestion/domain/quick_scoring_service.py",
    "src/hiresense/preference/domain/services.py",
    "src/hiresense/matching/domain/deep_analysis_service.py",
    "src/hiresense/composition/profile.py",
    "src/hiresense/composition/tracked_factory.py",
    # Assorted single-site narrowing gaps.
    "src/hiresense/shared/adapters/embedding/sentence_transformer_adapter.py",
    "src/hiresense/admin/domain/usage_aggregator.py",
    "src/hiresense/admin/infrastructure/usage_tracking_llm_adapter.py",
    "src/hiresense/shared/config/sources.py",
    "src/hiresense/identity/api/cookies.py",
    "src/hiresense/inbox/api/routes.py",
    "src/hiresense/inbox/infrastructure/imap_inbox_reader.py",
    "src/hiresense/ingestion/domain/normalizers/hn_hiring_normalizer.py",
    "src/hiresense/ingestion/infrastructure/jobs_repository.py",
    "src/hiresense/portfolio/api/routes.py",
    "src/hiresense/profile/domain/pdf_parser.py",
    "src/hiresense/scheduler/infrastructure/apscheduler_runner.py",
    "src/hiresense/tracking/domain/services.py",
]

# Single source of truth for dev tooling (uv dependency-groups). The old
# [project.optional-dependencies].dev block was removed — it pinned conflicting
# older versions of pytest/pytest-asyncio (#19).
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.16.0",
    "pyright>=1.1.390",
]
