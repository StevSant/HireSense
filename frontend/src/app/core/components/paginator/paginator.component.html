<div class="pagination-bar">
  <span class="pagination-info">
    Showing {{ showingFrom }}–{{ showingTo }} of {{ total() | number }} {{ itemLabel() }}
  </span>

  <div class="pagination-controls">
    <label class="page-size-label">
      Rows per page:
      <select [value]="pageSize()" (change)="onPageSizeChange($event)" class="page-size-select">
        @for (size of pageSizeOptions(); track size) {
          <option [value]="size">{{ size }}</option>
        }
      </select>
    </label>

    <button (click)="onPrev()" [disabled]="page() <= 1" class="btn-page">← Prev</button>

    <span class="page-indicator">Page {{ page() }} of {{ totalPages() }}</span>

    <button (click)="onNext()" [disabled]="page() >= totalPages()" class="btn-page">Next →</button>
  </div>
</div>
